<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard — Brandfletch Dev Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/portal/css/portal.css">
</head>
<body>
    <nav class="portal-nav">
        <a href="/" class="logo">Brandfletch</a>
        <div class="nav-links">
            <a href="/#hosting">Order Hosting</a>
            <a href="/" id="signOutBtn">Sign Out</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <div>
                <h1 id="userName">Loading...</h1>
                <p id="userEmail"></p>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-num" id="statHosting">--</span>
                <span class="stat-label">Active Hosting Accounts</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" id="statDomains">--</span>
                <span class="stat-label Registered Domains">Registered Domains</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" id="statOrders">--</span>
                <span class="stat-label">Total Orders</span>
            </div>
        </div>

        <!-- Hosting Accounts -->
        <div class="section">
            <h2 class="section-title">Hosting Accounts</h2>
            <div id="hostingAccounts">
                <div class="empty-state"><p>Loading...</p></div>
            </div>
        </div>

        <!-- Domains -->
        <div class="section">
            <h2 class="section-title">Domains</h2>
            <div id="domainsList">
                <div class="empty-state"><p>Loading...</p></div>
            </div>
        </div>

        <!-- Order History -->
        <div class="section">
            <h2 class="section-title">Order History</h2>
            <div id="ordersList">
                <div class="empty-state"><p>Loading...</p></div>
            </div>
        </div>
    </div>

    <script src="/portal/js/auth.js"></script>
    <script src="/portal/js/dashboard.js"></script>
</body>
</html>
