<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Customer Portal — Brandfletch Dev Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/portal/css/portal.css">
</head>
<body>
    <nav class="portal-nav">
        <a href="/" class="logo">Brandfletch</a>
        <div class="nav-links">
            <a href="/">Back to site</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">Brandfletch</div>

            <!-- Login Form -->
            <div id="loginView">
                <h1>Welcome back</h1>
                <p class="subtitle">Sign in to manage your hosting and domains.</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email address</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
                    <p id="loginError" class="auth-error"></p>
                </form>
                <p class="auth-toggle">
                    Don't have an account? <a href="#" id="showRegister">Create one</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerView" class="hidden">
                <h1>Create your account</h1>
                <p class="subtitle">Start managing your hosting and domains in one place.</p>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regName">Full name</label>
                        <input type="text" id="regName" placeholder="John Banda" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email address</label>
                        <input type="email" id="regEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Phone number</label>
                        <input type="tel" id="regPhone" placeholder="+265 991 23 45 67">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" placeholder="At least 6 characters" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create Account</button>
                    <p id="registerError" class="auth-error"></p>
                    <p id="registerSuccess" class="auth-success"></p>
                </form>
                <p class="auth-toggle">
                    Already have an account? <a href="#" id="showLogin">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/portal/js/auth.js"></script>
</body>
</html>
